name: Social autopost

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:
    inputs:
      mode:
        description: "check = test the token, run = post what is due, dry = show what would post"
        type: choice
        options: [check, run, dry]
        default: check

permissions:
  contents: write

concurrency:
  group: autopost
  cancel-in-progress: false

jobs:
  post:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Post due items
        env:
          META_PAGE_TOKEN: ${{ secrets.META_PAGE_TOKEN }}
          MODE: ${{ github.event.inputs.mode || 'run' }}
        run: |
          case "$MODE" in
            check) python3 autopost/post.py check ;;
            dry)   python3 autopost/post.py run --dry ;;
            *)     python3 autopost/post.py run ;;
          esac
      - name: Save what was posted
        if: always()
        run: |
          git config user.name "medalwise-autopost"
          git config user.email "autopost@users.noreply.github.com"
          git add autopost/state.json 2>/dev/null || true
          if ! git diff --cached --quiet; then
            git commit -m "autopost: update posted log [skip ci]"
            git pull --rebase origin main && git push origin HEAD:main
          fi
